<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Fun Fact Survey</title>
   <link rel="stylesheet" href="form.css">
</head>
<body>


   <form id="funFactForm" action = "addFIle()" method = "post">
       <div class="form-group">
           <label for="name">Your Name:</label>
           <input type="text" id="name" name="name" required>
       </div>
       <div class="form-group">
           <label for="funFact">What is your fun fact?</label>
           <input type="text" id="funFact" name="funFact" required>
       </div>
       <div class="form-group">
           <input type="checkbox" id="publishConsent" name="publishConsent">
           <label for="publishConsent">I allow for my fun fact to be published</label>
       </div>
       <button type="submit" >Submit</button>
   </form>


   <script src="formscript.js"></script>
</body>
